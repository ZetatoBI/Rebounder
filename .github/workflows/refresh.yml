name: Refresh data and deploy

on:
  schedule:
    - cron: "0 12 * * 1-5"        # full refresh before the US open: fundamentals, 2 years of bars, AI summaries
    - cron: "45 13-20 * * 1-5"    # hourly price refresh during US market hours (times are UTC)
  workflow_dispatch:
    inputs:
      mode:
        description: "full or hourly"
        default: "full"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      # Keep downloaded data between runs without committing it to git.
      - uses: actions/cache@v4
        with:
          path: web/data
          key: rw-data-${{ github.run_id }}
          restore-keys: rw-data-

      - name: Pick mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "mode=${{ inputs.mode }}" >> "$GITHUB_OUTPUT";
          elif [ "${{ github.event.schedule }}" = "0 12 * * 1-5" ]; then echo "mode=full" >> "$GITHUB_OUTPUT";
          else echo "mode=hourly" >> "$GITHUB_OUTPUT"; fi

      - name: Build data
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python pipeline/build_data.py --mode ${{ steps.mode.outputs.mode }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
